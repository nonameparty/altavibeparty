<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>TRAPPERREO — Scanner QR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
:root{
  --bg:#000;--text:#fff;--muted:#bdbdbd;--card:#0f0f10;--b:#191919;--accent:#8b5cf6;
  --ok:#22c55e;--warn:#fde047;--err:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui}
header{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);border-bottom:1px solid #111}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px}
h1{margin:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid #2b2b2b;background:#151515;color:#fff;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}
.btn.primary{background:var(--accent);color:#000;border:none}
.btn.ok{background:var(--ok);color:#000;border:none}
.btn.warn{background:var(--warn);color:#000;border:none}
.btn.stop{background:#fff;color:#000;border:none;font-size:18px;padding:14px 18px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #333;border-radius:999px;padding:6px 10px}
.muted{color:var(--muted)}
.hidden{display:none}
.small{font-size:12px}

.qrbox{position:relative;margin-top:8px}
#video{
  width:100%;
  max-height:62vh;
  background:#000;
  border-radius:12px;
  border:1px solid #111;
  display:block;
  object-fit:contain;
}
.qrbox::after{
  content:"";
  position:absolute;
  inset:10% 18%;
  border:2px solid rgba(255,255,255,.35);
  border-radius:14px;
  pointer-events:none;
}
.notice{padding:8px 10px;border-radius:10px;border:1px dashed rgba(255,255,255,.25);font-size:12px}
.notice.err{border-color:#ef4444;color:#ffdede;background:#2a0e0e}

.result-card{background:#0b0b0b;border:1px solid #1b1b1b;border-radius:12px;padding:12px}
.result-card .row{justify-content:space-between}
.center{display:grid;place-items:center}

/* ✅ popup "letto" */
.toast{
  position:fixed;left:50%;top:18px;transform:translateX(-50%);
  z-index:999;
  padding:12px 14px;border-radius:14px;
  background:rgba(34,197,94,.18);
  border:1px solid rgba(34,197,94,.55);
  color:#d7ffe4;font-weight:900;
  display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.toast.show{display:block}

/* ✅ evidenzia verifica documento */
.result-card.ok{border-color:rgba(34,197,94,.55); background:rgba(34,197,94,.08)}
.result-card.warn{border-color:rgba(253,224,71,.55); background:rgba(253,224,71,.10)}
.result-card.used{border-color:rgba(239,68,68,.55); background:rgba(239,68,68,.10)}
</style>
</head>
<body>
<header><div class="wrap"><h1>TRAPPERREO — Scanner QR</h1></div></header>

<div id="toast" class="toast">✅ QR letto</div>

<main class="wrap">

  <section id="grpCard" class="card">
    <div class="row">
      <span class="pill">È un gruppo?</span>
      <button id="gYes" class="btn">Sì</button>
      <button id="gNo"  class="btn">No</button>
      <span class="pill">Gruppo: <b id="gMode">—</b></span>
    </div>
    <div class="notice" style="margin-top:8px">
      iPhone richiede <b>HTTPS</b> (o <b>localhost</b>) e un <b>tap</b> per avviare la camera.
      Se non va: Impostazioni → Safari → Fotocamera → Consenti.
    </div>
  </section>

  <section id="ctrlCard" class="card hidden">
    <div class="row">
      <button id="startBtn" class="btn primary">🎥 Avvia fotocamera (posteriore)</button>

      <!-- ✅ AGGIUNTO: flash toggle -->
      <button id="flashBtn" class="btn" disabled>🔦 Flash</button>

      <button id="stopBtn"  class="btn stop" disabled>✋ STOP</button>
      <span id="status" class="muted"></span>
    </div>
    <div id="err" class="notice err hidden"></div>
    <div class="small muted" style="margin-top:8px">
      Tieni il QR dentro il riquadro, distanza ~15–30cm, luminosità alta.
    </div>
  </section>

  <section id="scanCard" class="card hidden">
    <div class="qrbox">
      <video id="video" playsinline muted></video>
    </div>
  </section>

  <section id="resCard" class="card hidden">
    <div id="resultBox" class="result-card"></div>

    <!-- ✅ NON HO TOLTO i tuoi bottoni: ho aggiunto “Annulla” e cambiato la logica -->
    <div class="row" style="margin-top:10px">
      <button id="okBtn" class="btn ok">✅ Corrisponde</button>
      <button id="flagBtn" class="btn warn">⚠️ Non corrisponde</button>
      <button id="cancelBtn" class="btn">↩️ Annulla</button>
    </div>
  </section>

  <!-- ✅ lasciato il tuo step cassa esattamente com’era -->
  <section id="cassaCard" class="card hidden center">
    <div>
      <div class="muted" style="margin-bottom:8px">Vai alla</div>
      <div id="cassaBox" class="big-cassa" style="font-size:40px;font-weight:900;background:#fff;color:#000;border-radius:16px;padding:16px 22px;display:inline-block">CASSA 2</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script type="module">
import { app, onUser } from './auth.v2.js?v=6';
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp,
  runTransaction
} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';

const db = getFirestore(app);

/* UI */
const grpCard   = document.getElementById('grpCard');
const ctrlCard  = document.getElementById('ctrlCard');
const scanCard  = document.getElementById('scanCard');
const resCard   = document.getElementById('resCard');
const cassaCard = document.getElementById('cassaCard');

const gYes = document.getElementById('gYes');
const gNo  = document.getElementById('gNo');
const gMode= document.getElementById('gMode');

const startBtn = document.getElementById('startBtn');
const flashBtn = document.getElementById('flashBtn');
const stopBtn  = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const errEl    = document.getElementById('err');

const toastEl  = document.getElementById('toast');

const video    = document.getElementById('video');
const okBtn    = document.getElementById('okBtn');
const flagBtn  = document.getElementById('flagBtn');
const cancelBtn= document.getElementById('cancelBtn');
const resultBox= document.getElementById('resultBox');
const cassaBox = document.getElementById('cassaBox');

let CURRENT_USER = null;

/* State */
let isGroup = null;
let stream = null;
let scanning = false;
let detector = null;
let scanTimer = null;

let LAST_SCAN_KEY = '';   // anti doppio “beep” locale
let FLASH_ON = false;

/* canvas per jsQR */
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently:true });

function showStep(step){
  grpCard.classList.toggle('hidden', step!=='grp');
  ctrlCard.classList.toggle('hidden', step!=='ctrl');
  scanCard.classList.toggle('hidden', step!=='scan');
  resCard.classList.toggle('hidden', step!=='res');
  cassaCard.classList.toggle('hidden', step!=='cassa');
}
function setStatus(t){ statusEl.textContent=t||''; }
function showErr(t){ errEl.textContent=t||''; errEl.classList.toggle('hidden', !t); }

function toast(msg='✅ QR letto', ms=3000){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}

function isHttpsOk(){
  return location.protocol === 'https:' || location.hostname === 'localhost';
}

/* ===== Heartbeat: meccanismo attivo SOLO quando qualcuno è nello scanner ===== */
let HB_T = null;
async function setScannerLive(active){
  try{
    await setDoc(doc(db,'system','live'), {
      scannerActive: !!active,
      scannerLastSeen: serverTimestamp(),
      scannerBy: CURRENT_USER?.uid || null
    }, { merge:true });
  }catch{}
}
function startHeartbeat(){
  stopHeartbeat();
  setScannerLive(true);
  HB_T = setInterval(()=> setScannerLive(true), 15000);
}
function stopHeartbeat(){
  if(HB_T){ clearInterval(HB_T); HB_T=null; }
  setScannerLive(false);
}

/* ===== Flash toggle (se supportato) ===== */
async function updateFlashButton(){
  try{
    if(!stream){ flashBtn.disabled = true; flashBtn.textContent = '🔦 Flash'; return; }
    const [track] = stream.getVideoTracks();
    const caps = track.getCapabilities?.() || {};
    const hasTorch = !!caps.torch;
    flashBtn.disabled = !hasTorch;
    flashBtn.textContent = FLASH_ON ? '🔦 Flash ON' : '🔦 Flash';
  }catch{
    flashBtn.disabled = true;
    flashBtn.textContent = '🔦 Flash';
  }
}
async function toggleFlash(){
  try{
    if(!stream) return;
    const [track] = stream.getVideoTracks();
    const caps = track.getCapabilities?.() || {};
    if(!caps.torch) return;
    FLASH_ON = !FLASH_ON;
    await track.applyConstraints({ advanced:[{ torch: FLASH_ON }] });
    updateFlashButton();
  }catch{}
}

/* Camera */
async function startCamera(){
  showErr('');
  if(!isHttpsOk()){
    showErr('Safari iOS blocca la camera su HTTP. Usa HTTPS o localhost.');
    return;
  }

  startBtn.disabled = true;
  stopBtn.disabled = false;
  setStatus('Apro la fotocamera…');

  try{
    const constraints = {
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height:{ ideal: 720 }
      },
      audio:false
    };

    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    video.setAttribute('playsinline','');
    await video.play();

    // BarcodeDetector (se c'è)
    detector = null;
    if ('BarcodeDetector' in window){
      try{ detector = new window.BarcodeDetector({ formats:['qr_code'] }); }
      catch{ detector = null; }
    }

    FLASH_ON = false;
    await updateFlashButton();

    scanning = true;
    showStep('scan');
    setStatus('Inquadrando…');

    // ✅ attiva heartbeat SOLO quando lo scanner è aperto
    startHeartbeat();

    startScanLoop();
  }catch(e){
    console.error('camera error', e);
    if (e.name === 'NotAllowedError'){
      showErr('Permesso negato. Abilita la camera nelle impostazioni del browser.');
    }else if (e.name === 'NotReadableError' || e.name === 'AbortError'){
      showErr('La fotocamera è in uso da un’altra app. Chiudila e riprova.');
    }else{
      showErr('Impossibile aprire la camera: ' + (e.message||e.name));
    }
    setStatus('Errore');
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }
}

async function stopCamera(){
  stopScanLoop();
  scanning = false;

  // ✅ stop heartbeat quando esci
  stopHeartbeat();

  try{ video.pause(); }catch{}
  if(stream){
    try{
      const [track] = stream.getVideoTracks();
      const caps = track.getCapabilities?.() || {};
      if(caps.torch && FLASH_ON){
        FLASH_ON = false;
        await track.applyConstraints({ advanced:[{ torch:false }] });
      }
    }catch{}
    stream.getTracks().forEach(t=>t.stop());
    stream=null;
  }
  await updateFlashButton();
  startBtn.disabled = false;
  stopBtn.disabled = true;
  setStatus('Fermato');
}

/* Loop 12fps */
function startScanLoop(){
  stopScanLoop();
  scanTimer = setInterval(async ()=>{
    if(!scanning) return;
    if(!video.videoWidth || !video.videoHeight) return;

    const payload = await tryDecodeFrame();
    if(payload){
      // anti-doppio locale
      if(payload === LAST_SCAN_KEY) return;
      LAST_SCAN_KEY = payload;
      setTimeout(()=>{ if(LAST_SCAN_KEY===payload) LAST_SCAN_KEY=''; }, 1200);

      scanning = false;
      stopScanLoop();
      toast('✅ QR letto', 1500);
      await onQrFound(payload);
    }
  }, 85);
}
function stopScanLoop(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
}

/* Decode */
async function tryDecodeFrame(){
  // 1) BarcodeDetector
  if(detector){
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length) return codes[0].rawValue || '';
    }catch{}
  }

  // 2) jsQR crop allineato al box (10% top/bot, 18% left/right)
  try{
    const vw = video.videoWidth;
    const vh = video.videoHeight;

    const insetTop = 0.10;
    const insetSide = 0.18;

    const sx = Math.floor(vw * insetSide);
    const sy = Math.floor(vh * insetTop);
    const sw = Math.floor(vw * (1 - insetSide*2));
    const sh = Math.floor(vh * (1 - insetTop*2));

    const targetW = 720;
    const scale = targetW / sw;
    const targetH = Math.max(360, Math.floor(sh * scale));

    canvas.width = targetW;
    canvas.height = targetH;

    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetW, targetH);
    const img = ctx.getImageData(0,0,targetW,targetH);

    const code = window.jsQR && window.jsQR(img.data, targetW, targetH, {
      inversionAttempts: "attemptBoth"
    });

    return code?.data || null;
  }catch{
    return null;
  }
}

/* Ticket */
function parseQR(text){
  try{
    const j = JSON.parse(text);
    return {
      uid: j.uid || '',
      ticketId: j.ticketId || j.tid || j.id || '',
      name: j.name || '',
      dob: j.dob || j.date_of_birth || ''
    };
  }catch{
    const parts = String(text).split('|');
    return { uid: parts[0]||'', ticketId: parts[1]||'', name:'', dob:'' };
  }
}

async function fetchTicketMeta(uid, ticketId){
  try{
    if(!uid || !ticketId) return null;
    const ref = doc(db, 'users', uid, 'tickets', ticketId);
    const snap = await getDoc(ref);
    return snap.exists()? { id: ticketId, ...snap.data() } : null;
  }catch{ return null; }
}

function pickCassa(){
  const n = [1,2,3][Math.floor(Math.random()*3)];
  return 'CASSA ' + n;
}

function safe(v){ return (v==null||v==='') ? '—' : String(v); }

async function onQrFound(raw){
  showStep('res');

  const q = parseQR(raw);
  const meta = await fetchTicketMeta(q.uid, q.ticketId);

  // ✅ blocco biglietto già usato (doppia scansione)
  const st = (meta?.status || 'pending').toString().toLowerCase();
  const alreadyUsed = (st === 'verified' || st === 'confirmed');

  // render
  resultBox.className = 'result-card' + (alreadyUsed ? ' used' : '');
  resultBox.innerHTML = `
    <div class="row">
      <div><strong>${safe(meta?.type||'Biglietto')}</strong> <span class="muted">#${safe(q.ticketId)}</span></div>
      <div class="pill">Stato: <b>${safe(meta?.status||'pending')}</b></div>
    </div>
    <div class="row"><div class="muted">Nome</div><div><b>${safe(meta?.name||q.name)}</b></div></div>
    <div class="row"><div class="muted">Data di nascita</div><div><b>${safe(meta?.dob||q.dob)}</b></div></div>
    <div class="row"><div class="muted">Email</div><div>${safe(meta?.email)}</div></div>
    ${alreadyUsed ? `<div class="notice err" style="margin-top:10px">⚠️ BIGLIETTO GIÀ UTILIZZATO — non puoi riconfermare.</div>` : ``}
  `;

  okBtn.disabled = alreadyUsed;
  flagBtn.disabled = alreadyUsed;

  okBtn.onclick   = ()=> finalizeTicket(q, meta, { status:'verified', docMatch:true });
  flagBtn.onclick = ()=> finalizeTicket(q, meta, { status:'flagged', docMatch:false });

  cancelBtn.onclick = ()=> {
    // ✅ annulla = non scrive nulla e riparte
    showStep('scan');
    scanning = true;
    startScanLoop();
  };
}

async function finalizeTicket(q, meta, { status, docMatch }){
  try{
    if(!q?.uid || !q?.ticketId) throw new Error('Dati QR incompleti');

    // evidenzia subito UI (senza refresh)
    resultBox.classList.remove('ok','warn','used');
    resultBox.classList.add(docMatch ? 'ok' : 'warn');

    // ✅ BLOCCO DOPPIA SCANSIONE: transaction
    const ticketRef = doc(db,'users',q.uid,'tickets',q.ticketId);
    const checkinId = `${q.uid}_${q.ticketId}`;
    const checkinRef = doc(db,'checkins',checkinId);

    await runTransaction(db, async (tx)=>{
      const snap = await tx.get(ticketRef);
      if(!snap.exists()) throw new Error('Ticket inesistente');

      const cur = (snap.data()?.status || 'pending').toString().toLowerCase();
      if(cur === 'verified' || cur === 'confirmed'){
        throw new Error('Biglietto già utilizzato');
      }

      // 1) aggiorna ticket utente
      tx.set(ticketRef, {
        status,
        docMatch: !!docMatch,
        docMismatch: !docMatch,
        checkedInAt: serverTimestamp(),
        checkedInBy: CURRENT_USER?.uid || null,
        updatedAt: serverTimestamp()
      }, { merge:true });

      // 2) checkins centrale (per realtime founder)
      tx.set(checkinRef, {
        uid: q.uid,
        ticketId: q.ticketId,
        status,
        docMatch: !!docMatch,
        checkedInAt: serverTimestamp(),
        checkedInBy: CURRENT_USER?.uid || null,

        name: meta?.name || q.name || '',
        dob:  meta?.dob  || q.dob  || '',
        email: meta?.email || '',
        ticketType: meta?.type || '',

        drinksAlcoholic: meta?.drinksAlcoholic ?? 0,
        drinksSoft: meta?.drinksSoft ?? 0
      }, { merge:true });
    });

    // UI cassa (come avevi tu)
    cassaBox.textContent = pickCassa();
    showStep('cassa');

    setTimeout(async ()=>{
      if(isGroup){
        showStep('scan');
        scanning = true;
        startScanLoop();
      }else{
        isGroup = null;
        gMode.textContent = '—';
        showStep('grp');
        await stopCamera();
      }
    }, 2200);

  }catch(e){
    console.error(e);
    showErr('Errore: ' + (e.message||e.name));
    // torna a scan senza scrivere nulla
    showStep('scan');
    scanning = true;
    startScanLoop();
  }
}

/* UI binds */
gYes.onclick = ()=>{ isGroup = true;  gMode.textContent='sì'; showStep('ctrl'); };
gNo.onclick  = ()=>{ isGroup = false; gMode.textContent='no'; showStep('ctrl'); };

startBtn.onclick = startCamera;
stopBtn.onclick  = stopCamera;
flashBtn.onclick = toggleFlash;

// iOS: se cambi tab, stop (evita camera “bloccata” al ritorno)
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) stopCamera();
});

// ✅ se chiudi la pagina scanner: spegni heartbeat
window.addEventListener('beforeunload', ()=>{ try{ stopHeartbeat(); }catch{} });

/* Boot */
onUser(async(u)=>{
  if(!u){ location.href='./login.html?from=./scanner.html'; return; }
  CURRENT_USER = u;
});
</script>
</body>
</html>
