<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>TRAPPERREO — Scanner QR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
:root{
  --bg:#000;--text:#fff;--muted:#bdbdbd;--card:#0f0f10;--b:#191919;--accent:#8b5cf6;
  --ok:#22c55e;--warn:#fde047;--err:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui}
header{position:sticky;top:0;z-index:10;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);border-bottom:1px solid #111}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px}
h1{margin:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid #2b2b2b;background:#151515;color:#fff;border-radius:14px;padding:12px 16px;font-weight:900;cursor:pointer}
.btn.primary{background:var(--accent);color:#000;border:none}
.btn.ok{background:var(--ok);color:#000;border:none}
.btn.warn{background:var(--warn);color:#000;border:none}
.btn.danger{background:var(--err);color:#000;border:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #333;border-radius:999px;padding:6px 10px}
.muted{color:var(--muted)}
.hidden{display:none}
.small{font-size:12px}

.qrbox{position:relative;margin-top:8px}
#video{
  width:100%;
  max-height:62vh;
  background:#000;
  border-radius:12px;
  border:1px solid #111;
  display:block;
  object-fit:contain;
}
.qrbox::after{
  content:"";
  position:absolute;
  inset:10% 18%;
  border:2px solid rgba(255,255,255,.35);
  border-radius:14px;
  pointer-events:none;
}
.notice{padding:8px 10px;border-radius:10px;border:1px dashed rgba(255,255,255,.25);font-size:12px}
.notice.err{border-color:#ef4444;color:#ffdede;background:#2a0e0e}
.result-card{background:#0b0b0b;border:1px solid #1b1b1b;border-radius:12px;padding:12px}
.result-card.ok{border-color:rgba(34,197,94,.55);background:rgba(34,197,94,.08)}
.result-card.warn{border-color:rgba(253,224,71,.55);background:rgba(253,224,71,.08)}
.result-card.bad{border-color:rgba(239,68,68,.55);background:rgba(239,68,68,.08)}
.result-card .row{justify-content:space-between}

.toast{
  position:fixed;left:50%;top:18px;transform:translateX(-50%);
  z-index:999;padding:12px 14px;border-radius:14px;
  background:rgba(34,197,94,.18);
  border:1px solid rgba(34,197,94,.55);
  color:#d7ffe4;font-weight:900;display:none;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.toast.show{display:block}

.footerActions{
  position:sticky;bottom:0;z-index:5;
  padding:12px 0;background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,0));
}
</style>
</head>
<body>
<header><div class="wrap"><h1>TRAPPERREO — Scanner QR</h1></div></header>

<div id="toast" class="toast">✅ QR letto</div>

<main class="wrap">
  <section id="grpCard" class="card">
    <div class="row">
      <span class="pill">È un gruppo?</span>
      <button id="gYes" class="btn">Sì</button>
      <button id="gNo"  class="btn">No</button>
      <span class="pill">Gruppo: <b id="gMode">—</b></span>
    </div>
    <div class="notice" style="margin-top:8px">
      iPhone richiede <b>HTTPS</b> (o <b>localhost</b>) e un <b>tap</b> per avviare la camera.
    </div>
  </section>

  <section id="scanCard" class="card hidden">
    <div class="row">
      <button id="stopBtn" class="btn">✋ Ferma camera</button>
      <button id="flashBtn" class="btn" disabled>💡 Flash</button>
      <span id="status" class="muted"></span>
    </div>

    <div id="err" class="notice err hidden" style="margin-top:10px"></div>

    <div class="qrbox" style="margin-top:10px">
      <video id="video" playsinline muted></video>
    </div>

    <div class="footerActions">
      <div class="row">
        <button id="endGroupBtn" class="btn warn hidden">⛔ Termina gruppo</button>
        <span class="small muted">Tip: QR nel riquadro, 15–30cm, luce alta.</span>
      </div>
    </div>
  </section>

  <section id="resCard" class="card hidden">
    <div id="resultBox" class="result-card"></div>
    <div id="alreadyUsed" class="notice err hidden" style="margin-top:10px">
      ⛔ Biglietto già usato.
    </div>
    <div class="row" style="margin-top:12px">
      <button id="okBtn" class="btn ok">✅ Corrisponde</button>
      <button id="misBtn" class="btn warn">⚠️ Non corrisponde</button>
      <button id="cancelBtn" class="btn">↩️ Annulla</button>
    </div>
    <div class="small muted" style="margin-top:10px">
      Torno allo scanner automaticamente dopo <b>10 secondi</b>.
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script type="module">
import { app, onUser } from './auth.v2.js?v=6';
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp, runTransaction
} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';

const db = getFirestore(app);

/* UI */
const grpCard = document.getElementById('grpCard');
const scanCard= document.getElementById('scanCard');
const resCard = document.getElementById('resCard');

const gYes = document.getElementById('gYes');
const gNo  = document.getElementById('gNo');
const gMode= document.getElementById('gMode');

const stopBtn = document.getElementById('stopBtn');
const flashBtn= document.getElementById('flashBtn');
const endGroupBtn = document.getElementById('endGroupBtn');

const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
const toastEl = document.getElementById('toast');

const video = document.getElementById('video');

const resultBox = document.getElementById('resultBox');
const alreadyUsed = document.getElementById('alreadyUsed');
const okBtn = document.getElementById('okBtn');
const misBtn= document.getElementById('misBtn');
const cancelBtn = document.getElementById('cancelBtn');

let CURRENT_USER = null;

let isGroup = null;
let stream = null;
let track = null;
let detector = null;
let scanning = false;
let scanTimer = null;

let torchSupported = false;
let torchOn = false;

let resAutoTimer = null;
let hbTimer = null;

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently:true });

function show(step){
  grpCard.classList.toggle('hidden', step!=='grp');
  scanCard.classList.toggle('hidden', step!=='scan');
  resCard.classList.toggle('hidden', step!=='res');
}
function setStatus(t){ statusEl.textContent = t || ''; }
function showErr(t){ errEl.textContent = t || ''; errEl.classList.toggle('hidden', !t); }
function toast(msg, ms=900){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), ms);
}
function isHttpsOk(){
  return location.protocol==='https:' || location.hostname==='localhost';
}

/* heartbeat: ON solo mentre camera+scan attivi */
function startHeartbeat(){
  stopHeartbeat();
  hbTimer = setInterval(async ()=>{
    try{
      await setDoc(doc(db,'system','live'), {
        scannerActive:true,
        updatedAt: serverTimestamp(),
        byUid: CURRENT_USER?.uid || null
      }, { merge:true });
    }catch{}
  }, 5000);
}
function stopHeartbeat(){
  if(hbTimer){ clearInterval(hbTimer); hbTimer=null; }
}

/* Torch */
async function detectTorch(){
  torchSupported = false;
  try{
    const caps = track?.getCapabilities?.();
    torchSupported = !!caps?.torch;
  }catch{}
  flashBtn.disabled = !torchSupported;
  flashBtn.textContent = torchSupported ? (torchOn ? '💡 Flash ON' : '💡 Flash OFF') : '💡 Flash';
}
async function setTorch(on){
  if(!torchSupported || !track) return;
  try{
    await track.applyConstraints({ advanced:[{ torch: !!on }] });
    torchOn = !!on;
    flashBtn.textContent = torchOn ? '💡 Flash ON' : '💡 Flash OFF';
  }catch{}
}

/* camera */
async function startCamera(){
  showErr('');
  if(!isHttpsOk()){
    showErr('Safari iOS blocca la camera su HTTP. Usa HTTPS o localhost.');
    return;
  }
  setStatus('Apro la fotocamera…');

  try{
    const constraints = {
      video: { facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } },
      audio:false
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    video.setAttribute('playsinline','');
    await video.play();

    track = stream.getVideoTracks()[0] || null;
    torchOn = false;
    await detectTorch();

    detector = null;
    if('BarcodeDetector' in window){
      try{ detector = new window.BarcodeDetector({ formats:['qr_code'] }); }catch{}
    }

    scanning = true;
    show('scan');
    endGroupBtn.classList.toggle('hidden', !isGroup);
    setStatus('Inquadrando…');
    startHeartbeat();
    startScanLoop();
  }catch(e){
    console.error(e);
    showErr('Camera non disponibile: ' + (e.message||e.name));
    setStatus('Errore');
  }
}

async function stopCamera(){
  stopScanLoop();
  scanning = false;
  stopHeartbeat();
  clearTimeout(resAutoTimer);

  try{ await setTorch(false); }catch{}
  try{ video.pause(); }catch{}
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  track=null; detector=null;
  flashBtn.disabled = true;
  setStatus('Fermato');
}

/* scan loop 12fps */
function startScanLoop(){
  stopScanLoop();
  scanTimer = setInterval(async ()=>{
    if(!scanning) return;
    if(!video.videoWidth || !video.videoHeight) return;
    const payload = await decodeFrame();
    if(!payload) return;

    scanning = false;
    stopScanLoop();
    toast('✅ QR letto', 700);
    await onQr(payload);
  }, 85);
}
function stopScanLoop(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
}

async function decodeFrame(){
  if(detector){
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length) return codes[0].rawValue || '';
    }catch{}
  }
  try{
    const vw = video.videoWidth, vh = video.videoHeight;
    const insetTop = 0.10, insetSide = 0.18;
    const sx = Math.floor(vw * insetSide);
    const sy = Math.floor(vh * insetTop);
    const sw = Math.floor(vw * (1 - insetSide*2));
    const sh = Math.floor(vh * (1 - insetTop*2));

    const targetW = 720;
    const scale = targetW / sw;
    const targetH = Math.max(360, Math.floor(sh * scale));
    canvas.width = targetW; canvas.height = targetH;

    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetW, targetH);
    const img = ctx.getImageData(0,0,targetW,targetH);

    const code = window.jsQR && window.jsQR(img.data, targetW, targetH, { inversionAttempts:"attemptBoth" });
    return code?.data || null;
  }catch{ return null; }
}

/* ticket */
function parseQR(text){
  try{
    const j = JSON.parse(text);
    return { uid:j.uid||'', ticketId:j.ticketId||j.tid||j.id||'', name:j.name||'', dob:j.dob||'' };
  }catch{
    const p = String(text).split('|');
    return { uid:p[0]||'', ticketId:p[1]||'', name:'', dob:'' };
  }
}
async function fetchMeta(uid, ticketId){
  if(!uid || !ticketId) return null;
  const ref = doc(db,'users',uid,'tickets',ticketId);
  const snap = await getDoc(ref);
  return snap.exists()? { id:ticketId, ...snap.data() } : null;
}
const safe = (v)=> (v==null||v==='') ? '—' : String(v);

async function onQr(raw){
  clearTimeout(resAutoTimer);
  show('res');
  alreadyUsed.classList.add('hidden');
  resultBox.className = 'result-card';

  const q = parseQR(raw);
  const meta = await fetchMeta(q.uid, q.ticketId);

  const st = String(meta?.status||'pending').toLowerCase();
  const used = !!meta?.used || ['verified','flagged','mismatch'].includes(st);

  resultBox.innerHTML = `
    <div class="row">
      <div><strong>${safe(meta?.type||'Biglietto')}</strong> <span class="muted">#${safe(q.ticketId)}</span></div>
      <div class="pill">Stato: <b>${safe(meta?.status||'pending')}</b></div>
    </div>
    <div class="row"><div class="muted">Nome</div><div><b>${safe(meta?.name||q.name)}</b></div></div>
    <div class="row"><div class="muted">Data di nascita</div><div><b>${safe(meta?.dob||q.dob)}</b></div></div>
    <div class="row"><div class="muted">Tipo</div><div><b>${safe(meta?.type)}</b></div></div>
  `;

  if(used){
    resultBox.classList.add('bad');
    alreadyUsed.classList.remove('hidden');
    okBtn.disabled = true;
    misBtn.disabled = true;
  }else{
    okBtn.disabled = false;
    misBtn.disabled = false;
  }

  okBtn.onclick = ()=> finalize(q, meta, { status:'verified', mismatch:false });
  misBtn.onclick= ()=> finalize(q, meta, { status:'mismatch', mismatch:true });
  cancelBtn.onclick = ()=> resumeScan();

  // auto ritorno dopo 10s (come vuoi tu)
  resAutoTimer = setTimeout(()=> resumeScan(), 10000);
}

function resumeScan(){
  clearTimeout(resAutoTimer);
  show('scan');
  endGroupBtn.classList.toggle('hidden', !isGroup);
  scanning = true;
  startScanLoop();
}

async function finalize(q, meta, {status, mismatch}){
  try{
    clearTimeout(resAutoTimer);
    const ticketRef = doc(db,'users',q.uid,'tickets',q.ticketId);
    const checkinId = `${q.uid}_${q.ticketId}`;
    const checkinRef= doc(db,'checkins',checkinId);

    await runTransaction(db, async (tx)=>{
      const snap = await tx.get(ticketRef);
      if(!snap.exists()) throw new Error('Ticket non trovato');
      const t = snap.data()||{};
      const st = String(t.status||'pending').toLowerCase();
      const used = !!t.used || ['verified','flagged','mismatch'].includes(st);
      if(used) throw new Error('Ticket già usato');

      tx.set(ticketRef, {
        status,
        mismatch: !!mismatch,
        used: true,
        usedAt: serverTimestamp(),
        checkedInAt: serverTimestamp(),
        checkedInBy: CURRENT_USER?.uid || null,
        updatedAt: serverTimestamp()
      }, { merge:true });

      tx.set(checkinRef, {
        uid: q.uid,
        ticketId: q.ticketId,
        status,
        mismatch: !!mismatch,
        checkedInAt: serverTimestamp(),
        checkedInBy: CURRENT_USER?.uid || null,
        name: meta?.name || q.name || '',
        dob:  meta?.dob  || q.dob  || '',
        email: meta?.email || '',
        ticketType: meta?.type || ''
      }, { merge:true });

      tx.set(doc(db,'system','live'), {
        scannerActive:true,
        updatedAt: serverTimestamp(),
        lastWriteAt: serverTimestamp(),
        byUid: CURRENT_USER?.uid || null
      }, { merge:true });
    });

    resultBox.classList.add(mismatch ? 'warn' : 'ok');
    toast(mismatch ? '⚠️ NON CORRISPONDE' : '✅ CORRISPONDE', 900);

    // resta visibile 10s e poi torna
    resAutoTimer = setTimeout(()=>{
      if(isGroup){
        resumeScan();
      }else{
        // torna all’inizio e stop camera (privacy)
        isGroup=null; gMode.textContent='—';
        show('grp');
        stopCamera();
      }
    }, 10000);

  }catch(e){
    console.error(e);
    showErr('Errore: ' + (e.message||e.name));
    // torna a scan
    resAutoTimer = setTimeout(()=> resumeScan(), 1200);
  }
}

/* UI binds */
gYes.onclick = async ()=>{
  isGroup = true; gMode.textContent='sì';
  // auto start camera con lo stesso tap (iOS)
  await startCamera();
};
gNo.onclick = async ()=>{
  isGroup = false; gMode.textContent='no';
  await startCamera();
};

stopBtn.onclick = async ()=>{
  await stopCamera();
  // torna a scelta gruppo
  isGroup=null; gMode.textContent='—';
  show('grp');
};

flashBtn.onclick = ()=> setTorch(!torchOn);

endGroupBtn.onclick = ()=>{
  // termina gruppo: torna a "è un gruppo?" ma camera resta accesa e continua scan
  isGroup = null;
  gMode.textContent='—';
  show('grp');
  // NON stop camera, così “va da sola”
  // riprendo a scansionare in background
  scanning = true;
  startScanLoop();
};

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) stopCamera();
});

onUser(async(u)=>{
  if(!u){ location.href='./login.html?from=./scanner.html'; return; }
  CURRENT_USER = u;
});
</script>
</body>
</html>
