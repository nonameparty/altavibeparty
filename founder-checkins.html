<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Founder — Check-in realtime</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#000; --text:#fff; --card:rgba(255,255,255,.06); --border:rgba(255,255,255,.12);
  --muted:rgba(255,255,255,.72); --accent:#8b5cf6;
  --ok:#22c55e; --warn:#fde047; --bad:#ef4444;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:auto;padding:18px}
.top{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
.topin{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:900}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 10px;font-weight:900}
.badge.ok{border-color:rgba(34,197,94,.40)}
.badge.bad{border-color:rgba(239,68,68,.45)}
.badge.accent{border-color:rgba(139,92,246,.45)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:14px}
.input{flex:1;min-width:220px;background:#0f0f10;border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;padding:10px 12px;font-weight:800}
.btn{padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff;font-weight:900;cursor:pointer}

.table{width:100%;border-collapse:separate;border-spacing:0 10px}
.table th{font-size:12px;color:rgba(255,255,255,.65);text-align:left;padding:0 10px}
.table td{background:#0b0b0b;border:1px solid rgba(255,255,255,.10);padding:10px;border-left:none;border-right:none}
.table tr td:first-child{border-left:1px solid rgba(255,255,255,.10);border-top-left-radius:14px;border-bottom-left-radius:14px}
.table tr td:last-child{border-right:1px solid rgba(255,255,255,.10);border-top-right-radius:14px;border-bottom-right-radius:14px}

.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900}
.pill.ok{border-color:rgba(34,197,94,.40)}
.pill.warn{border-color:rgba(253,224,71,.40)}

.spin{
  width:14px;height:14px;border-radius:999px;
  border:2px solid rgba(255,255,255,.22);
  border-top-color:rgba(34,197,94,.95);
  animation:rot 0.9s linear infinite;
}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">TRAPPERREO — Check-in realtime</div>
    <div class="row">
      <a class="badge accent" href="./founder.html">← Founder</a>
      <a class="badge" href="./scanner.html">📷 Scanner</a>

      <span id="liveBadge" class="badge bad">⏸️ In attesa</span>
      <span id="liveSpin" class="spin" style="display:none"></span>

      <span class="badge">Ultimo write: <b id="lastWrite">—</b></span>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <div class="row">
      <input id="q" class="input" placeholder="Cerca per nome, email, ticketId…" />
      <button id="clear" class="btn">Reset</button>
      <span class="badge">Totale: <b id="count">—</b></span>
    </div>
    <div class="muted" style="margin-top:10px;font-size:12px">
      LIVE si accende solo quando lo scanner è aperto e scrive l’heartbeat su <b>system/live</b>.
    </div>
  </div>

  <div class="card">
    <table class="table">
      <thead>
        <tr>
          <th>Ora</th><th>Nome</th><th>DOB</th><th>Tipo</th><th>Stato</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="muted" style="display:none;margin-top:10px;font-size:12px">Nessun check-in.</div>
  </div>
</main>

<script type="module">
import { app, onUser } from './auth.v2.js?v=6';
import {
  getFirestore, collection, query, orderBy, limit, onSnapshot, doc
} from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';

const db = getFirestore(app);

const qInput = document.getElementById('q');
const clearBtn = document.getElementById('clear');
const countEl = document.getElementById('count');
const tbody = document.getElementById('tbody');
const empty = document.getElementById('empty');

const liveBadge = document.getElementById('liveBadge');
const liveSpin  = document.getElementById('liveSpin');
const lastWriteEl = document.getElementById('lastWrite');

let ALL = [];
let UNSUB_CHECKINS = null;
let UNSUB_LIVE = null;

function lc(s){ return (s||'').toString().toLowerCase().trim(); }
function fmtTime(ts){
  try{
    if(!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch{ return '—'; }
}
function pill(x){
  if(x.mismatch) return `<span class="pill warn">mismatch</span>`;
  const st = lc(x.status);
  if(st==='verified') return `<span class="pill ok">verified</span>`;
  return `<span class="pill warn">${st||'—'}</span>`;
}

function render(arr){
  tbody.innerHTML = '';
  countEl.textContent = String(arr.length);
  empty.style.display = arr.length ? 'none' : 'block';

  const term = lc(qInput.value);
  const filtered = !term ? arr : arr.filter(x=>
    lc(x.name).includes(term) || lc(x.email).includes(term) || lc(x.ticketId).includes(term) || lc(x.ticketType).includes(term)
  );

  filtered.forEach(x=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${fmtTime(x.checkedInAt)}</td>
      <td><b>${x.name||'—'}</b><div style="font-size:12px;color:rgba(255,255,255,.65)">${x.email||''}</div></td>
      <td>${(x.dob||'').toString().slice(0,10) || '—'}</td>
      <td>${x.ticketType || '—'}<div style="font-size:12px;color:rgba(255,255,255,.65)">#${x.ticketId||'—'}</div></td>
      <td>${pill(x)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function start(){
  const qy = query(collection(db,'checkins'), orderBy('checkedInAt','desc'), limit(500));
  UNSUB_CHECKINS = onSnapshot(qy, (snap)=>{
    const arr = [];
    snap.forEach(d=> arr.push({ id:d.id, ...(d.data()||{}) }));
    ALL = arr;
    render(ALL);
  });

  UNSUB_LIVE = onSnapshot(doc(db,'system','live'), (snap)=>{
    const v = snap.exists()? (snap.data()||{}) : {};
    const ts = v.updatedAt;
    const last = v.lastWriteAt;

    const now = Date.now();
    const updatedMs = ts?.toDate ? ts.toDate().getTime() : 0;
    const on = v.scannerActive && updatedMs && (now - updatedMs) < 15000;

    liveSpin.style.display = on ? '' : 'none';
    liveBadge.className = 'badge ' + (on ? 'ok' : 'bad');
    liveBadge.textContent = on ? '🟢 LIVE' : '⏸️ In attesa';

    if(last?.toDate){
      lastWriteEl.textContent = last.toDate().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }else lastWriteEl.textContent = '—';
  });
}

onUser(async(u)=>{
  if(!u){ location.href='./login.html?from=./founder-checkins.html'; return; }
  start();
});

qInput.addEventListener('input', ()=> render(ALL));
clearBtn.onclick = ()=>{ qInput.value=''; render(ALL); };

window.addEventListener('beforeunload', ()=>{
  try{ UNSUB_CHECKINS && UNSUB_CHECKINS(); }catch{}
  try{ UNSUB_LIVE && UNSUB_LIVE(); }catch{}
});
</script>
</body>
</html>
